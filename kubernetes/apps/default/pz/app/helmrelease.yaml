---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pz
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m0s
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: longhorn
      namespace: storage
    - name: cloudflare-tunnel
      namespace: network
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/indifferentbroccoli/projectzomboid-server-docker
              tag: v1.2.0@sha256:0bfd0599c0cf3edf66ba40937ce3ae2a7c5de92073dc99d1c7e9a01fa581414e
            env:
              - name: PUID
                value: 1000
              - name: PGID
                value: 1000
            securityContext:
              allowPrivilegeEscalation: false
              # capabilities:
              #   drop:
              #   - ALL
    service:
      app:
        ports:
          player:
            enabled: true
            port: &player 16261
            protocol: UDP
          listen:
            enabled: true
            port: &udp 16262
            protocol: UDP
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dot-hex.xyz"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *player
