---
# yaml-language-server: $schema=https://kubernetes-schemas.perry.cafe/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-unifi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      data:
        UNIFI_HOST: "{{ .unifi_host }}"
        UNIFI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: unifi
